name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      - name: Build
        run: make all
      - name: Build tests
        run: make test_engine test_protocol test_history
      - name: Run tests
        run: |
          make test
      - name: Build examples
        run: make examples
      - name: Verify clean build
        run: |
          make clean
          make
          make test
